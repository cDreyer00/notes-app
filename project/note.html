<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/src/styles.css" />
    <title>Notes</title>
    <script type="module" src="/src/note.ts" defer></script>
  </head>

  <body>
    <!-- As alças de redimensionamento nascem em window-chrome.ts: são oito e
         idênticas em toda janela do app. -->
    <div class="drag-strip" data-drag></div>
    <button id="note-close" type="button" class="window-close" title="Fechar">
      ✕
    </button>

    <section class="view">
      <textarea
        id="editor"
        spellcheck="false"
        autocomplete="off"
        placeholder="Escreva…"
      ></textarea>
    </section>

    <footer id="hints" class="hints" data-drag></footer>

    <div id="confirm" class="overlay hidden">
      <div class="dialog">
        <p class="dialog-title">Deletar esta nota?</p>
        <p class="dialog-hint">Enter confirma · Esc cancela</p>
        <div class="dialog-actions">
          <button id="confirm-cancel" type="button">Cancelar</button>
          <button id="confirm-ok" type="button" class="danger">Deletar</button>
        </div>
      </div>
    </div>
  </body>
</html>
